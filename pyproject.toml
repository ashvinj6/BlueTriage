[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-triage-agent"
version = "0.1.0"
description = "An explainable SOC alert enrichment, triage, and evaluation MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<3",
  "pydantic>=2.6,<3",
  "streamlit>=1.35,<2",
]

[project.optional-dependencies]
llm = ["openai>=1.50"]
dev = ["pytest>=8,<9"]

[project.scripts]
soc-triage = "soc_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

